<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Registro Tech Store</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">
    <main class="container py-5">
        <h1 class="text-center mb-4">
            Registro de Cliente
        </h1>
        <form
            id="formulario"
            class="card p-4 shadow-sm">
            <div class="mb-3">
                <label
                    for="nombre"
                    class="form-label">
                    Nombre
                </label>
                <input
                    type="text"
                    id="nombre"
                    class="form-control">
            </div>
            <div class="mb-3">
                <label
                    for="apellido"
                    class="form-label">
                    Apellido
                </label>
                <input
                    type="text"
                    id="apellido"
                    class="form-control">
            </div>
            <div class="mb-3">
                <label
                    for="correo"
                    class="form-label">
                    Correo electrónico
                </label>
                <input
                    type="text"
                    id="correo"
                    class="form-control">
            </div>
            <div class="mb-3">
                <label
                    for="edad"
                    class="form-label">
                    Edad
                </label>
                <input
                    type="text"
                    id="edad"
                    class="form-control">
            </div>
            <button
                type="submit"
                class="btn btn-primary">
                Registrar
            </button>
            <div
                id="mensaje"
                class="mt-3">
            </div>
        </form>
    </main>
    <script src="funciones.js"></script>
</body>
</html>
