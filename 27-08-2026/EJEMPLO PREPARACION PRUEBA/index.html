<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>Registro Tech Store</title>
    <link
        rel="stylesheet"
        href="css/estilos.css">
</head>
<body>
    <main class="contenedor">
        <h1>Registro de Cliente</h1>
        <p class="introduccion">
            Completa tus datos para registrarte en Tech Store.
        </p>
        <form id="formularioRegistro">
            <!-- NOMBRE -->
            <div class="campo">
                <label for="nombre">
                    Nombre
                </label>
                <input
                    type="text"
                    id="nombre"
                    autocomplete="given-name"
                    placeholder="Ej: Carolina">
                <small
                    id="errorNombre"
                    class="mensaje-error">
                </small>
            </div>
            <!-- APELLIDO -->
            <div class="campo">
                <label for="apellido">
                    Apellido
                </label>
                <input
                    type="text"
                    id="apellido"
                    autocomplete="family-name"
                    placeholder="Ej: Soto">
                <small
                    id="errorApellido"
                    class="mensaje-error">
                </small>
            </div>
            <!-- CORREO -->
            <div class="campo">
                <label for="correo">
                    Correo electrónico
                </label>
                <input
                    type="text"
                    id="correo"
                    autocomplete="email"
                    placeholder="Ej: alumno@correo.cl">
                <small
                    id="errorCorreo"
                    class="mensaje-error">
                </small>
            </div>
            <!-- EDAD -->
            <div class="campo">
                <label for="edad">
                    Edad
                </label>
                <input
                    type="text"
                    id="edad"
                    placeholder="Ej: 20">
                <small
                    id="errorEdad"
                    class="mensaje-error">
                </small>
            </div>
            <!-- CONTRASEÑA -->
            <div class="campo">
                <label for="password">
                    Contraseña
                </label>
                <input
                    type="password"
                    id="password"
                    autocomplete="new-password"
                    placeholder="Mínimo 6 caracteres">
                <small
                    id="errorPassword"
                    class="mensaje-error">
                </small>
            </div>
            <!-- REPETIR CONTRASEÑA -->
            <div class="campo">
                <label for="confirmarPassword">
                    Repetir contraseña
                </label>
                <input
                    type="password"
                    id="confirmarPassword"
                    autocomplete="new-password">
                <small
                    id="errorConfirmarPassword"
                    class="mensaje-error">
                </small>
            </div>
            <!-- TÉRMINOS -->
            <div class="campo-check">
                <input
                    type="checkbox"
                    id="terminos">
                <label for="terminos">
                    Acepto los términos y condiciones
                </label>
            </div>
            <small
                id="errorTerminos"
                class="mensaje-error">
            </small>
            <!-- BOTÓN -->
            <button type="submit">
                Registrar cliente
            </button>
            <!-- MENSAJE FINAL -->
            <div
                id="mensajeFinal"
                class="mensaje-final">
            </div>
        </form>
    </main>
    <script src="js/validaciones.js"></script>
</body>
</html>
